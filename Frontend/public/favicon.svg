<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#030308"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Rounded Card Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect width="502" height="502" x="5" y="5" rx="117" fill="none" stroke="url(#accentGrad)" stroke-width="6" opacity="0.6"/>
  
  <!-- Outer Dark Store Monogram Emblem -->
  <g filter="url(#neonGlow)">
    <!-- Letter D -->
    <path d="M 130 130 H 240 C 310 130 355 175 355 256 C 355 337 310 382 240 382 H 130 Z M 185 185 V 327 H 235 C 275 327 298 300 298 256 C 298 212 275 185 235 185 Z" fill="url(#accentGrad)"/>
    
    <!-- Stylized Dynamic Wave / S-Line Accent -->
    <path d="M 270 170 Q 380 256 260 340" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
    
    <!-- Accent Star / Spark -->
    <circle cx="375" cy="140" r="16" fill="#00f2fe"/>
  </g>
</svg>